AWSTemplateFormatVersion: '2010-09-09'

Description: >
  DevOps Connect - IVR Migration root stack.
  Orchestrates all nested stacks in dependency order and wires
  outputs from upstream stacks into downstream stacks.

# =============================================================================
# PARAMETERS
# =============================================================================

Parameters:

  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------

  Environment:
    Type: String
    Default: dev
    Description: Deployment environment.

  ProjectName:
    Type: String
    Default: ivr-migration
    Description: Project identifier.

  # ---------------------------------------------------------------------------
  # Nested template location
  # ---------------------------------------------------------------------------

  TemplateBucketName:
    Type: String
    Description: S3 bucket containing nested CloudFormation templates.

  TemplateS3Prefix:
    Type: String
    Default: cloudformation
    Description: S3 prefix containing nested CloudFormation templates.

  # ---------------------------------------------------------------------------
  # Lambda code location
  # ---------------------------------------------------------------------------

  LambdaCodeS3Bucket:
    Type: String
    Description: S3 bucket containing Lambda deployment packages.

  LambdaCodeS3Prefix:
    Type: String
    Default: lambda-src
    Description: S3 prefix containing Lambda packages.

  # ---------------------------------------------------------------------------
  # Storage
  # ---------------------------------------------------------------------------

  StorageBucketPrefix:
    Type: String
    Description: Prefix used by 01-storage.yaml for all application buckets.

  ExistingMigrationBucketName:
    Type: String
    Default: ''
  ExistingBackupBucketName:
    Type: String
    Default: ''
  ExistingArtifactBucketName:
    Type: String
    Default: ''

  # ---------------------------------------------------------------------------
  # DynamoDB
  # ---------------------------------------------------------------------------

  EnvironmentTableName:
    Type: String

  AuditTableName:
    Type: String

  ExistingEnvironmentTableName:
    Type: String
    Default: ''
  ExistingAuditTableName:
    Type: String
    Default: ''

  # ---------------------------------------------------------------------------
  # Source control
  # ---------------------------------------------------------------------------

  CodeCommitRepositoryName:
    Type: String
    Default: Devops-Connect-SCM-BKP

  CodeCommitBranchName:
    Type: String
    Default: main

  ExistingRepositoryName:
    Type: String
    Default: ''

  # ---------------------------------------------------------------------------
  # IAM role names
  # ---------------------------------------------------------------------------

  UILambdaRoleName:
    Type: String

  UpdateLambdaRoleName:
    Type: String

  PipelineRoleName:
    Type: String

  ExistingUILambdaRoleArn:
    Type: String
    Default: ''
  ExistingUpdateLambdaRoleArn:
    Type: String
    Default: ''
  ExistingPipelineRoleArn:
    Type: String
    Default: ''

  # ---------------------------------------------------------------------------
  # UI-GC Lambda
  # ---------------------------------------------------------------------------

  UiGcLambdaName:
    Type: String

  UiGcLambdaMemory:
    Type: Number

  UiGcLambdaTimeout:
    Type: Number

  ExistingUiGcLambdaArn:
    Type: String
    Default: ''

  # ---------------------------------------------------------------------------
  # Update Contact Flow Lambda
  # ---------------------------------------------------------------------------

  UpdateContactFlowLambdaName:
    Type: String

  UpdateContactFlowLambdaMemory:
    Type: Number

  UpdateContactFlowLambdaTimeout:
    Type: Number

  ExistingUpdateContactFlowLambdaArn:
    Type: String
    Default: ''

  # ---------------------------------------------------------------------------
  # API Gateway
  # ---------------------------------------------------------------------------

  ApiName:
    Type: String

  ApiStageName:
    Type: String

  ExistingApiId:
    Type: String
    Default: ''

  # ---------------------------------------------------------------------------
  # Pipeline
  # ---------------------------------------------------------------------------

  PipelineName:
    Type: String

  ExistingPipelineName:
    Type: String
    Default: ''

  # ---------------------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------------------

  LogRetentionDays:
    Type: Number

  ExistingUIGCLogGroupName:
    Type: String
    Default: ''
  ExistingUpdateFlowLogGroupName:
    Type: String
    Default: ''

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------

  DeployFrontendInfrastructure:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  FrontendBucketPrefix:
    Type: String
    Default: devops-connect-frontend

  FrontendDefaultRootObject:
    Type: String
    Default: index.html

  ExistingFrontendBucketName:
    Type: String
    Default: ''
  ExistingCloudFrontDistributionId:
    Type: String
    Default: ''
  ExistingCloudFrontDomainName:
    Type: String
    Default: ''

  CloudFrontPriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All


# =============================================================================
# CONDITIONS
# =============================================================================

Conditions:

  DeployFrontend: !Equals [!Ref DeployFrontendInfrastructure, 'true']
  CreateFrontendHosting: !And
    - !Equals [!Ref DeployFrontendInfrastructure, 'true']
    - !Equals [!Ref ExistingFrontendBucketName, '']


# =============================================================================
# RESOURCES
# =============================================================================

Resources:

  # ===========================================================================
  # 01 - STORAGE
  # ===========================================================================

  StorageStack:
    Type: AWS::CloudFormation::Stack

    Properties:

      TemplateURL: !Sub
        - "https://${Bucket}.s3.${AWS::Region}.amazonaws.com/${Prefix}/01-storage.yaml"
        - Bucket: !Ref TemplateBucketName
          Prefix: !Ref TemplateS3Prefix

      Parameters:
        BucketPrefix: !Ref StorageBucketPrefix
        ExistingMigrationBucketName: !Ref ExistingMigrationBucketName
        ExistingBackupBucketName: !Ref ExistingBackupBucketName
        ExistingArtifactBucketName: !Ref ExistingArtifactBucketName

      Tags:
        - Key: Project
          Value: !Ref ProjectName

        - Key: Environment
          Value: !Ref Environment


  # ===========================================================================
  # 02 - DATA
  # ===========================================================================

  DataStack:
    Type: AWS::CloudFormation::Stack

    Properties:

      TemplateURL: !Sub
        - "https://${Bucket}.s3.${AWS::Region}.amazonaws.com/${Prefix}/02-data.yaml"
        - Bucket: !Ref TemplateBucketName
          Prefix: !Ref TemplateS3Prefix

      Parameters:
        EnvironmentTableName: !Ref EnvironmentTableName
        AuditTableName: !Ref AuditTableName
        ExistingEnvironmentTableName: !Ref ExistingEnvironmentTableName
        ExistingAuditTableName: !Ref ExistingAuditTableName

      Tags:
        - Key: Project
          Value: !Ref ProjectName

        - Key: Environment
          Value: !Ref Environment


  # ===========================================================================
  # 03 - SOURCE CONTROL
  # ===========================================================================

  SourceControlStack:
    Type: AWS::CloudFormation::Stack

    Properties:

      TemplateURL: !Sub
        - "https://${Bucket}.s3.${AWS::Region}.amazonaws.com/${Prefix}/03-source-control.yaml"
        - Bucket: !Ref TemplateBucketName
          Prefix: !Ref TemplateS3Prefix

      Parameters:
        RepositoryName: !Ref CodeCommitRepositoryName
        ExistingRepositoryName: !Ref ExistingRepositoryName

      Tags:
        - Key: Project
          Value: !Ref ProjectName

        - Key: Environment
          Value: !Ref Environment


  # ===========================================================================
  # 04 - IAM
  # ===========================================================================

  IAMStack:
    Type: AWS::CloudFormation::Stack

    Properties:

      TemplateURL: !Sub
        - "https://${Bucket}.s3.${AWS::Region}.amazonaws.com/${Prefix}/04-iam.yaml"
        - Bucket: !Ref TemplateBucketName
          Prefix: !Ref TemplateS3Prefix

      Parameters:
        UILambdaRoleName: !Ref UILambdaRoleName
        UpdateLambdaRoleName: !Ref UpdateLambdaRoleName
        PipelineRoleName: !Ref PipelineRoleName
        ExistingUILambdaRoleArn: !Ref ExistingUILambdaRoleArn
        ExistingUpdateLambdaRoleArn: !Ref ExistingUpdateLambdaRoleArn
        ExistingPipelineRoleArn: !Ref ExistingPipelineRoleArn

      Tags:
        - Key: Project
          Value: !Ref ProjectName

        - Key: Environment
          Value: !Ref Environment


  # ===========================================================================
  # 05 - UI-GC LAMBDA
  # ===========================================================================

  LambdaUiGcStack:
    Type: AWS::CloudFormation::Stack

    DependsOn:
      - StorageStack
      - DataStack
      - SourceControlStack
      - IAMStack

    Properties:

      TemplateURL: !Sub
        - "https://${Bucket}.s3.${AWS::Region}.amazonaws.com/${Prefix}/05-lambda-ui-gc.yaml"
        - Bucket: !Ref TemplateBucketName
          Prefix: !Ref TemplateS3Prefix

      Parameters:

        UiGcBucketName:
          !GetAtt StorageStack.Outputs.MigrationBucketName

        BackupBucketName:
          !GetAtt StorageStack.Outputs.BackupBucketName

        EnvtTableName:
          !GetAtt DataStack.Outputs.EnvironmentTableName

        AuditTableName:
          !GetAtt DataStack.Outputs.AuditTrailTableName

        CodeCommitRepoName:
          !GetAtt SourceControlStack.Outputs.RepositoryName

        CodeCommitBranchName:
          !Ref CodeCommitBranchName

        FunctionName:
          !Ref UiGcLambdaName

        ExecutionRoleArn:
          !GetAtt IAMStack.Outputs.UILambdaRoleArn

        LambdaCodeS3Bucket:
          !Ref LambdaCodeS3Bucket

        LambdaCodeS3Key:
          !Sub "${LambdaCodeS3Prefix}/ui-gc.zip"

        MemorySize:
          !Ref UiGcLambdaMemory

        TimeoutSeconds:
          !Ref UiGcLambdaTimeout

        ExistingFunctionArn:
          !Ref ExistingUiGcLambdaArn

      Tags:
        - Key: Project
          Value: !Ref ProjectName

        - Key: Environment
          Value: !Ref Environment


  # ===========================================================================
  # 06 - UPDATE CONTACT FLOW LAMBDA
  # ===========================================================================

  LambdaUpdateContactFlowStack:
    Type: AWS::CloudFormation::Stack

    DependsOn:
      - StorageStack
      - DataStack
      - SourceControlStack
      - IAMStack

    Properties:

      TemplateURL: !Sub
        - "https://${Bucket}.s3.${AWS::Region}.amazonaws.com/${Prefix}/06-lambda-update-contact-flow.yaml"
        - Bucket: !Ref TemplateBucketName
          Prefix: !Ref TemplateS3Prefix

      Parameters:

        BackupBucketName:
          !GetAtt StorageStack.Outputs.BackupBucketName

        AuditTableName:
          !GetAtt DataStack.Outputs.AuditTrailTableName

        CodeCommitRepoName:
          !GetAtt SourceControlStack.Outputs.RepositoryName

        FunctionName:
          !Ref UpdateContactFlowLambdaName

        ExecutionRoleArn:
          !GetAtt IAMStack.Outputs.UpdateLambdaRoleArn

        LambdaCodeS3Bucket:
          !Ref LambdaCodeS3Bucket

        LambdaCodeS3Key:
          !Sub "${LambdaCodeS3Prefix}/update-contact-flow.zip"

        MemorySize:
          !Ref UpdateContactFlowLambdaMemory

        TimeoutSeconds:
          !Ref UpdateContactFlowLambdaTimeout

        ExistingFunctionArn:
          !Ref ExistingUpdateContactFlowLambdaArn

      Tags:
        - Key: Project
          Value: !Ref ProjectName

        - Key: Environment
          Value: !Ref Environment


  # ===========================================================================
  # 07 - API GATEWAY
  # ===========================================================================

  ApiStack:
    Type: AWS::CloudFormation::Stack

    DependsOn:
      - LambdaUiGcStack

    Properties:

      TemplateURL: !Sub
        - "https://${Bucket}.s3.${AWS::Region}.amazonaws.com/${Prefix}/07-api.yaml"
        - Bucket: !Ref TemplateBucketName
          Prefix: !Ref TemplateS3Prefix

      Parameters:

        ApiName:
          !Ref ApiName

        StageName:
          !Ref ApiStageName

        UILambdaArn:
          !GetAtt LambdaUiGcStack.Outputs.FunctionArn

        UILambdaName:
          !GetAtt LambdaUiGcStack.Outputs.FunctionName

        ExistingApiId:
          !Ref ExistingApiId

      Tags:
        - Key: Project
          Value: !Ref ProjectName

        - Key: Environment
          Value: !Ref Environment


  # ===========================================================================
  # 08 - CODEPIPELINE
  # ===========================================================================

  PipelineStack:
    Type: AWS::CloudFormation::Stack

    DependsOn:
      - StorageStack
      - SourceControlStack
      - IAMStack
      - LambdaUpdateContactFlowStack

    Properties:

      TemplateURL: !Sub
        - "https://${Bucket}.s3.${AWS::Region}.amazonaws.com/${Prefix}/08-pipeline.yaml"
        - Bucket: !Ref TemplateBucketName
          Prefix: !Ref TemplateS3Prefix

      Parameters:

        PipelineName:
          !Ref PipelineName

        RepositoryName:
          !GetAtt SourceControlStack.Outputs.RepositoryName

        RepositoryBranch:
          !Ref CodeCommitBranchName

        ArtifactBucketName:
          !GetAtt StorageStack.Outputs.ArtifactBucketName

        PipelineRoleArn:
          !GetAtt IAMStack.Outputs.PipelineRoleArn

        UpdateLambdaFunctionName:
          !GetAtt LambdaUpdateContactFlowStack.Outputs.FunctionName

        ExistingPipelineName:
          !Ref ExistingPipelineName

      Tags:
        - Key: Project
          Value: !Ref ProjectName

        - Key: Environment
          Value: !Ref Environment


  # ===========================================================================
  # 09 - OBSERVABILITY
  # ===========================================================================

  ObservabilityStack:
    Type: AWS::CloudFormation::Stack

    DependsOn:
      - LambdaUiGcStack
      - LambdaUpdateContactFlowStack

    Properties:

      TemplateURL: !Sub
        - "https://${Bucket}.s3.${AWS::Region}.amazonaws.com/${Prefix}/09-observability.yaml"
        - Bucket: !Ref TemplateBucketName
          Prefix: !Ref TemplateS3Prefix

      Parameters:

        UIGCFunctionName:
          !GetAtt LambdaUiGcStack.Outputs.FunctionName

        UpdateFlowFunctionName:
          !GetAtt LambdaUpdateContactFlowStack.Outputs.FunctionName

        LogRetentionDays:
          !Ref LogRetentionDays

        ExistingUIGCLogGroupName:
          !Ref ExistingUIGCLogGroupName

        ExistingUpdateFlowLogGroupName:
          !Ref ExistingUpdateFlowLogGroupName

      Tags:
        - Key: Project
          Value: !Ref ProjectName

        - Key: Environment
          Value: !Ref Environment


  # ===========================================================================
  # 10 - FRONTEND HOSTING
  # ===========================================================================

  FrontendHostingStack:
    Type: AWS::CloudFormation::Stack

    Condition: CreateFrontendHosting

    Properties:

      TemplateURL: !Sub
        - "https://${Bucket}.s3.${AWS::Region}.amazonaws.com/${Prefix}/10-frontend-hosting.yaml"
        - Bucket: !Ref TemplateBucketName
          Prefix: !Ref TemplateS3Prefix

      Parameters:

        FrontendBucketPrefix:
          !Ref FrontendBucketPrefix

        DefaultRootObject:
          !Ref FrontendDefaultRootObject

        PriceClass:
          !Ref CloudFrontPriceClass

        ExistingFrontendBucketName:
          !Ref ExistingFrontendBucketName

        ExistingCloudFrontDistributionId:
          !Ref ExistingCloudFrontDistributionId

        ExistingCloudFrontDomainName:
          !Ref ExistingCloudFrontDomainName

      Tags:
        - Key: Project
          Value: !Ref ProjectName

        - Key: Environment
          Value: !Ref Environment


# =============================================================================
# OUTPUTS
# =============================================================================

Outputs:

  MigrationBucketName:
    Description: Migration S3 bucket.
    Value: !GetAtt StorageStack.Outputs.MigrationBucketName

  BackupBucketName:
    Description: Backup S3 bucket.
    Value: !GetAtt StorageStack.Outputs.BackupBucketName

  ArtifactBucketName:
    Description: CodePipeline artifact S3 bucket.
    Value: !GetAtt StorageStack.Outputs.ArtifactBucketName

  EnvironmentTableName:
    Description: Environment DynamoDB table.
    Value: !GetAtt DataStack.Outputs.EnvironmentTableName

  AuditTrailTableName:
    Description: Audit trail DynamoDB table.
    Value: !GetAtt DataStack.Outputs.AuditTrailTableName

  CodeCommitRepoCloneUrlHttp:
    Description: CodeCommit HTTPS clone URL.
    Value: !GetAtt SourceControlStack.Outputs.CloneUrlHttp

  UiGcLambdaArn:
    Description: UI-GC Lambda ARN.
    Value: !GetAtt LambdaUiGcStack.Outputs.FunctionArn

  UpdateContactFlowLambdaArn:
    Description: Update Contact Flow Lambda ARN.
    Value: !GetAtt LambdaUpdateContactFlowStack.Outputs.FunctionArn

  ApiInvokeUrl:
    Description: API Gateway invoke URL.
    Value: !GetAtt ApiStack.Outputs.InvokeUrl

  PipelineName:
    Description: CodePipeline name.
    Value: !GetAtt PipelineStack.Outputs.PipelineName

  CloudFrontDomainName:
    Condition: DeployFrontend
    Description: CloudFront frontend URL.
    Value: !If
      - CreateFrontendHosting
      - !GetAtt FrontendHostingStack.Outputs.CloudFrontDomainName
      - !Ref ExistingCloudFrontDomainName
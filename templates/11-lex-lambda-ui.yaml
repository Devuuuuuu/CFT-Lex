AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Creates or reuses the Devops-Lex-UI Lambda.
  Environment-specific resource names are supplied through parameters.

Parameters:

  ExistingLexUILambdaArn:
    Type: String
    Default: ''
    Description: Existing Devops-Lex-UI Lambda ARN. Leave empty to create it.

  LambdaFunctionName:
    Type: String
    Default: Devops-Lex-UI
    Description: Name of the Lex UI Lambda.

  ExecutionRoleArn:
    Type: String
    Description: IAM execution role ARN for the Lex UI Lambda.

  CodeS3Bucket:
    Type: String
    Description: S3 bucket containing the Lambda deployment package.

  CodeS3Key:
    Type: String
    Description: S3 key of the Lambda deployment package.

  LexUiBucketName:
    Type: String
    Description: Temporary S3 bucket used by Lex UI Lambda.

  CodeCommitRepositoryName:
    Type: String
    Description: CodeCommit repository used for Lex migration.

  CodeCommitBranchName:
    Type: String
    Default: master
    Description: CodeCommit branch used for Lex migration.

  LexAuditTableName:
    Type: String
    Description: DynamoDB audit table used by Lex migration.

Conditions:

  CreateLexUILambda:
    !Equals
      - !Ref ExistingLexUILambdaArn
      - ''

Resources:

  LexUILambda:
    Type: AWS::Lambda::Function
    Condition: CreateLexUILambda

    Properties:

      FunctionName: !Ref LambdaFunctionName

      Runtime: python3.14

      Architectures:
        - x86_64

      Handler: lambda_function.lambda_handler

      Role: !Ref ExecutionRoleArn

      MemorySize: 128

      Timeout: 900

      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key

      Environment:
        Variables:

          LEX_UI_BUCKET_NAME:
            !Ref LexUiBucketName

          CODECOMMIT_REPO_NAME:
            !Ref CodeCommitRepositoryName

          CODECOMMIT_BRANCH_NAME:
            !Ref CodeCommitBranchName

          LEX_AUDIT_TABLE_NAME:
            !Ref LexAuditTableName

      Tags:

        - Key: Name
          Value: !Ref LambdaFunctionName

        - Key: Application
          Value: AWS-ConnectOps

        - Key: Component
          Value: Lex-Migration

Outputs:

  LexUILambdaArn:
    Description: ARN of the Devops-Lex-UI Lambda

    Value:
      !If
        - CreateLexUILambda
        - !GetAtt LexUILambda.Arn
        - !Ref ExistingLexUILambdaArn

  LexUILambdaName:
    Description: Name of the Devops-Lex-UI Lambda

    Value:
      !If
        - CreateLexUILambda
        - !Ref LexUILambda
        - !Select
          - 6
          - !Split
            - ':'
            - !Ref ExistingLexUILambdaArn